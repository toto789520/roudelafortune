name: Docker Image and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest
      - name: Lancer les tests unitaires
        env:
          REDIS_HOST: localhost
        run: python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag my-image-name:ci
      - name: Sauvegarder l'image
        run: docker save my-image-name:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          
  web_test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          name: docker-image
      - name: Charger l'image
        run: docker load -i image.tar
      - name: Run Redis
        run: docker run -d -p 6379:6379 redis:7-alpine
      - name: Run the Docker image
        run: docker run -d -p 8000:8000 -e REDIS_HOST=host.docker.internal -e SECRET_KEY=ci-smoke-test-secret-key --add-host=host.docker.internal:host-gateway my-image-name:ci
      - name: Attendre le démarrage de l'app
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then
              echo "App accessible"
              exit 0
            fi
            sleep 2
          done
          echo "App non accessible après 60s"
          docker logs $(docker ps -q --filter ancestor=my-image-name:ci)
          exit 1
      - name: test-web-accessibility
        run: |
          rm -f /tmp/cookies
          status=$(curl -s -o /dev/null -w "%{http_code}" -c /tmp/cookies -b /tmp/cookies -L http://127.0.0.1:8000/)
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "Page d'accueil non accessible (status $status != 200)"
            docker logs $(docker ps -q --filter ancestor=my-image-name:ci)
            exit 1
          fi
