services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "${REDIS_PORT:-6379}"]
    expose:
      - "${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    networks:
      - roudelafortune_net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        PORT: ${PORT:-8000}
    expose:
      - "${PORT:-8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${PORT:-8000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - roudelafortune_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  roudelafortune_net:
    driver: bridge
